name: content-review

# An end-of-semester AI review of the teaching material, filed as an issue
# for a human to judge. It NEVER commits to main.
#
# Scope is deliberately narrow. Questions a compiler can answer are already
# answered better by CI (verify_snippets compiles every deck and lab
# snippet, and the labs-solutions repo runs the exercises and diffs their
# output). What is left for a model is the part no tool can reach:
#   - does a lecture's explanation still match its lab's exercise?
#   - is terminology consistent across decks?
#   - does a hint give the answer away?
#   - is a practice question answerable from the material as taught?
#
# TWO PROVIDERS, chosen with the `provider` input:
#
#   copilot (default)  GitHub Copilot CLI, authenticated by the workflow's
#                      own GITHUB_TOKEN via `copilot-requests: write`. No
#                      stored secret, and nothing that expires. A Pro seat
#                      entitles claude-sonnet-5 (the default here),
#                      claude-sonnet-4.6 and gpt-5.4 -- NOT the Opus family.
#                      Metered as AI credits against the plan; a full
#                      nine-topic run costs a few hundred of the monthly
#                      allowance, so once a year is comfortable.
#
#   bedrock            Amazon Bedrock, via the BEDROCK_API_KEY secret. Gets
#                      a higher tier of model (Opus 4.6) than Copilot Pro
#                      allows, but the key expires and must be rotated by
#                      hand. Kept so the two can be diffed over the same
#                      decks, and as a fallback.
#
# `copilot-requests: write` lets the token spend Copilot credits. It does
# NOT grant write access to repository contents.

on:
  schedule:
    - cron: '0 7 15 12 *'     # 15 December, after teaching ends
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to review'
        type: choice
        default: 'everything'
        options: [everything, lectures, labs, practice]
      provider:
        description: 'Which backend to review with'
        type: choice
        default: 'copilot'
        options: [copilot, bedrock]

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  review:
    if: github.repository == 'danielcregg/object-oriented-computing'
    runs-on: ubuntu-latest
    env:
      # Scheduled runs supply no inputs, so both fall back to their default.
      # The scheduled default is copilot precisely because it cannot expire.
      REVIEW_PROVIDER: ${{ inputs.provider || 'copilot' }}
      REVIEW_SCOPE: ${{ inputs.scope || 'everything' }}
    steps:
      - uses: actions/checkout@v4

      - name: Is a credential configured?
        id: creds
        # The secret arrives through `env`, never through ${{ }} inside the
        # script. A ${{ }} expansion is pasted into the shell source before
        # bash parses it, so any quote or metacharacter in the value would
        # change what runs; via env it is only ever data.
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
        run: |
          if [ "$REVIEW_PROVIDER" = "copilot" ]; then
            # GITHUB_TOKEN is always present, so there is nothing to check.
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEDROCK_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Provider is 'bedrock' but no BEDROCK_API_KEY secret is set -" \
                 "skipping the review. Add it in Settings -> Secrets and" \
                 "variables -> Actions, or re-run with provider 'copilot'," \
                 "which needs no secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        if: steps.creds.outputs.ready == 'true' && env.REVIEW_PROVIDER == 'bedrock'
        run: pip install --quiet boto3

      - name: Set up Node.js
        if: steps.creds.outputs.ready == 'true' && env.REVIEW_PROVIDER == 'copilot'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: steps.creds.outputs.ready == 'true' && env.REVIEW_PROVIDER == 'copilot'
        # Not pre-installed on GitHub-hosted runners. GITHUB_TOKEN auth needs
        # a recent CLI, so this deliberately tracks latest rather than pinning.
        run: npm install -g @github/copilot

      - name: Review the content
        if: steps.creds.outputs.ready == 'true'
        env:
          # bedrock: boto3 reads this env var directly; the key cannot be
          # passed as a client argument, so the env var IS the mechanism.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.BEDROCK_REGION || 'eu-west-1' }}
          # copilot: the workflow's own token, scoped by copilot-requests.
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/content_review.py --provider "$REVIEW_PROVIDER"

      # Keep the findings whatever else happens.
      - name: Upload the findings
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: content-review-findings
          path: content-review-findings.md
          if-no-files-found: warn

      # An ISSUE, not a pull request. Creating a PR needs the repo-wide
      # "Allow GitHub Actions to create and approve pull requests" setting,
      # which also lets any workflow APPROVE pull requests -- not worth
      # granting to publish a markdown file. Issues need only the
      # issues: write permission already scoped to this workflow.
      - name: Open an issue with the findings
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content review findings ($(date +%Y-%m-%d), $REVIEW_PROVIDER)"
          # the label may not exist yet; fall back to filing without it
          gh issue create --title "$TITLE" \
                          --body-file content-review-findings.md \
                          --label content-review \
            || gh issue create --title "$TITLE" \
                               --body-file content-review-findings.md

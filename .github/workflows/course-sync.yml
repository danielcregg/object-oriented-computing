name: course-sync

# Runs in a STUDENT's copy of the template, every night, so corrections to
# the lectures, lab instructions, README, MCQ brief and schedule reach their
# repo whether or not they ever open a Codespace. It runs the same script a
# Codespace runs on opening (scripts/update-course-content.sh): course
# content only, never their code, and a course file they edited themselves
# is kept. The script commits the refresh and pushes it to main itself.
#
# Nothing is remembered between runs: the script recognises untouched course
# files by comparing them with every version the module repo has published,
# so this run, a Codespace and a laptop always agree on what the student has
# edited.
#
# In the module's own repo there is nothing to sync from: the job is skipped.
#
# The checkout action is pinned by commit, not by tag: this job has write
# access in hundreds of student copies, so a retagged or compromised "v4"
# would reach all of them at once.

# One run at a time: a manual run overlapping the nightly one would push
# the same refresh twice and report a spurious failure.
concurrency: course-sync

on:
  schedule:
    - cron: '5 1 * * *'   # 01:05 UTC nightly (02:05 Irish summer time, 01:05 in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'danielcregg/object-oriented-computing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # the script reads this repo's history to respect files the student deleted

      - name: Sync the course content
        run: |
          bash scripts/update-course-content.sh | tee "$RUNNER_TEMP/sync.log"
          { echo '```'; cat "$RUNNER_TEMP/sync.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The script never exits non-zero (it must never stop a Codespace
          # from opening), so a refresh it could not push would otherwise
          # vanish with this runner and leave a green tick. Make that red.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::The course update was made but could not be pushed to this repository; see the log above."
            exit 1
          fi

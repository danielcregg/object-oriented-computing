name: labs

# Do the labs compile? One of the two workflows that run in a STUDENT's copy
# of the template (deliberately unguarded; course-sync.yml is the other):
# every push gets a green tick if every .java file under lectures-and-labs
# compiles, and a red cross with the compiler's message if not. It never
# runs anything, never grades, never comments. The module's own CI (marp.yml)
# compiles the same files as one of its gates.
#
# Actions are pinned by commit, not by tag: this runs in hundreds of copies,
# so a retagged or compromised "v4" would reach all of them at once.

on:
  push:
    paths: ['lectures-and-labs/**/*.java', '.github/workflows/labs.yml']
  pull_request:
    paths: ['lectures-and-labs/**/*.java']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21 (the same JDK as the Codespace)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile every lab source file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          find lectures-and-labs -name '*.java' -print0 \
            | xargs -0 --no-run-if-empty javac -d "$RUNNER_TEMP/classes"
          echo "All lab sources compile." >> "$GITHUB_STEP_SUMMARY"

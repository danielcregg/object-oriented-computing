name: marp
concurrency: marp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety audit + snippet verification + diagram freshness
        run: |
          set -euo pipefail
          python3 scripts/safety_audit.py
          python3 scripts/verify_snippets.py
          python3 scripts/check_diagrams.py

      - name: Set up Java (for snippet verification)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@4.5.0

      - name: Render decks
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/build_index.py build
          # mapfile, NOT find|while: a piped while-loop hands the pipe to the
          # loop body's stdin, and marp-cli treats piped stdin as an extra
          # markdown input ("Converting 2 markdowns" + output-path error).
          mapfile -t decks < <(find weeks -type f -path '*/lecture/slides.md' | sort)
          for f in "${decks[@]}"; do
            lecture_dir=$(dirname "$f")
            week_dir=$(basename "$(dirname "$lecture_dir")")
            out="build/$week_dir"
            mkdir -p "$out"
            if [ -d "$lecture_dir/img" ]; then cp -R "$lecture_dir/img" "$out/img"; fi
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/index.html"
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/slides.pdf"
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/slides.pptx"
          done
          # TEMPORARY preview: publish the slides-reimagined.md drafts (HTML
          # only) under /reimagined/ for review. Remove this whole block once
          # the adoption decision is made.
          mapfile -t drafts < <(find weeks -type f -path '*/lecture/slides-reimagined.md' | sort)
          mkdir -p build/reimagined
          {
            printf '%s\n' "<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>"
            printf '%s\n' "<title>Reimagined decks (preview)</title>"
            printf '%s\n' "<style>body{font-family:Consolas,monospace;background:#FBFAF7;color:#1E2833;padding:28px;line-height:2.1}a{color:#33698C}h2 b{color:#E76F00}</style>"
            printf '%s\n' "<h2><b>//</b> reimagined decks — preview</h2><ul>"
          } > build/reimagined/index.html
          for f in "${drafts[@]}"; do
            lecture_dir=$(dirname "$f")
            week_dir=$(basename "$(dirname "$lecture_dir")")
            out="build/reimagined/$week_dir"
            mkdir -p "$out"
            if [ -d "$lecture_dir/img" ]; then cp -R "$lecture_dir/img" "$out/img"; fi
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/index.html"
            printf '%s\n' "<li><a href='$week_dir/'>$week_dir</a></li>" >> build/reimagined/index.html
          done
          echo '</ul>' >> build/reimagined/index.html

      - name: Upload rendered decks as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-decks
          path: build/

      - name: Deploy to gh-pages
        continue-on-error: true   # Pages serving may be unavailable on a private repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/

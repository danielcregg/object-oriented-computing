name: marp
concurrency: marp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Pages is deployed straight from this workflow (no gh-pages branch): the
# built site is uploaded as an artifact and published by actions/deploy-pages.
# Nothing lands in git, so the copies students make from this template
# inherit only the source, and the deployment history lives in the
# github-pages environment with rollback, instead of as commits nobody reads.
# Least privilege by default: the build job only reads the repo. The Pages
# write + OIDC token are granted to the deploy job alone, so the job that
# runs marp, npm and the build scripts cannot publish to the site even if
# something it executes tries to.
permissions:
  contents: read

jobs:
  build:
    # Only ever run in the module's own repo. Students copy this repo from
    # the template, and a template copy has Actions ENABLED (unlike a fork),
    # so without this guard their first push would run this workflow, fail
    # at the Pages deploy they have not configured, and mail them a red X.
    if: github.repository == 'danielcregg/object-oriented-computing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java MUST be set up before the gates below: they shell out to javac.
      # This step used to sit AFTER them, so the pin never applied and the
      # snippets were compiled by whatever JDK the runner image happened to
      # ship -- silent drift if GitHub changes that default, and a hard
      # failure if an image ever ships without a JDK at all.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, to match .devcontainer/devcontainer.json
          # (mcr.microsoft.com/devcontainers/java:1-21-bookworm). The gate's
          # promise is "this material compiles for a student", so it has to
          # compile on the JDK the student's Codespace actually runs. Change
          # both together or the promise stops being true.
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gates - safety audit, link check, snippet + lab compile, bank check
        run: |
          set -euo pipefail
          javac -version
          python3 scripts/safety_audit.py
          python3 scripts/check_links.py
          python3 scripts/verify_snippets.py
          python3 scripts/check_practice_bank.py
          find labs/src -name '*.java' -print0 \
            | xargs -0 --no-run-if-empty javac -d "$RUNNER_TEMP/labs-classes"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@4.5.0

      - name: Render decks
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -m pip install --quiet markdown
          python3 scripts/build_index.py build
          python3 scripts/build_lab_pages.py build
          mkdir -p build/practice
          cp -R practice/. build/practice/
          # mapfile, NOT find|while: a piped while-loop hands the pipe to the
          # loop body's stdin, and marp-cli treats piped stdin as an extra
          # markdown input ("Converting 2 markdowns" + output-path error).
          mapfile -t decks < <(find weeks -type f -name 'slides.md' | sort)
          for f in "${decks[@]}"; do
            week_dir_path=$(dirname "$f")
            week_dir=$(basename "$week_dir_path")
            out="build/$week_dir"
            mkdir -p "$out"
            if [ -d "$week_dir_path/img" ]; then cp -R "$week_dir_path/img" "$out/img"; fi
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/index.html"
            # PDF only. Marp's pptx export wraps each slide as an image, so it
            # offers nothing the PDF doesn't, while adding ~6 MB per deck to
            # every deploy -- and pptx are zip archives, so git cannot delta
            # them and the gh-pages history grew by that much on every push.
            marp "$f" --html --allow-local-files --theme-set themes/ooc.css -o "$out/slides.pdf"
          done
          touch build/.nojekyll   # serve the output as-is; no Jekyll pass

      - name: Upload rendered decks as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-decks
          path: build/

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/

  deploy:
    needs: build
    if: github.repository == 'danielcregg/object-oriented-computing'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # publish the artifact
      id-token: write     # OIDC token deploy-pages exchanges for that right
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
